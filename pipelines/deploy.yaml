trigger:
  branches:
    include:
      - main
pr: none

name: Deploy Azure Static Web App

variables:
- group: chatbot_variables
- name: vmImageName
  value: 'ubuntu-latest'

pool:
  vmImage: $(vmImageName)

stages:
- stage: Preview
  displayName: "Staging"
  jobs:
  - job: 'Deploy'
    displayName: "Deploy to Preview env"
    steps:
    - task: AzureStaticWebApp@0
      inputs:
        app_location: '.'
        output_location: 'dist/my-resume-chatbot/browser'
        api_location: 'api'
        azure_static_web_apps_api_token: $(deployment_token)
        deployment_environment: 'preview'

- stage: Production
  displayName: "Production"
  jobs:
  - job: 'Deploy'
    displayName: "Deploy to Production env"
    environment: prod
    steps:
    - task: AzureStaticWebApp@0
      inputs:
        app_location: '.'
        output_location: 'dist/my-resume-chatbot/browser'
        api_location: 'api'
        azure_static_web_apps_api_token: $(deployment_token)
